<script>
document.addEventListener("DOMContentLoaded", function () {

  const toc = document.querySelector("#TOC");
  if (!toc) return;

  /*
   * Replace Quarto TOC links with clean clones.
   * This removes Quarto's original click handlers.
   */
  const oldLinks = Array.from(
    toc.querySelectorAll('a[href^="#"]')
  );

  oldLinks.forEach(oldLink => {
    const newLink = oldLink.cloneNode(true);
    oldLink.replaceWith(newLink);
  });


  // Get the new clean links
  const tocLinks = Array.from(
    toc.querySelectorAll('a[href^="#"]')
  );

  const sections = [];


  tocLinks.forEach(link => {
    const href = link.getAttribute("href");

    if (!href || !href.startsWith("#")) return;

    const target = document.querySelector(href);

    if (!target) return;

    link.addEventListener("click", function (e) {
      e.preventDefault();

      const targetY =
        target.getBoundingClientRect().top +
        window.scrollY -
        80;

      window.scrollTo({
        top: targetY,
        behavior: "auto"
      });

      history.replaceState(null, "", href);
    });
});


  /*
   * Active TOC highlighting
   */
  function updateTOC() {

    let current = null;

    sections.forEach(item => {

      const rect =
        item.section.getBoundingClientRect();

      if (rect.top <= 250) {
        current = item;
      }

    });


    tocLinks.forEach(link => {
      link.classList.remove("active");
    });


    if (current) {
      current.link.classList.add("active");
    }

  }


  window.addEventListener(
    "scroll",
    updateTOC,
    { passive: true }
  );

  updateTOC();


  /*
   * Back to top
   */
  const backToTop =
    document.createElement("a");

  backToTop.href = "#";
  backToTop.className = "back-to-top";
  backToTop.innerHTML = "Back to top ↑";

  backToTop.addEventListener(
    "click",
    function (e) {

      e.preventDefault();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );

  toc.appendChild(backToTop);


  /*
   * Sidebar logos
   */
  const marginSidebar =
    document.querySelector(
      "#quarto-margin-sidebar"
    );

  if (marginSidebar) {

    const logoBox =
      document.createElement("div");

    logoBox.className =
      "sidebar-logos";

    logoBox.innerHTML = `
      <img class="chang-logo"
           src="images/site-logo.jpg"
           alt="Chang Group">

      <img class="westlake-logo"
           src="images/westlake-logo.png"
           alt="Westlake University">
    `;

    marginSidebar.appendChild(
      logoBox
    );

  }

});
</script>
